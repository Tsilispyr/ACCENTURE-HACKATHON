# APP stack - rebuilt and redeployed constantly, so it is kept separate from
# the stateful infra stack. It joins the infra network as `external`.
# PIN THE PROJECT NAME. Compose derives it from the directory when it is not
# set, so moving these files into deployment/ silently renamed the project from
# "hackathon2" to "deployment". Compose then saw none of its own containers,
# tried to create fresh ones, and hit the pinned container_name:
#
#   Conflict. The container name "/h2-postgres" is already in use
#
# The stack was healthy the whole time; compose just no longer recognised it.
# Pinned here rather than via COMPOSE_PROJECT_NAME in deploy.sh so that a bare
# `docker compose` run from any directory adopts the same containers.
name: hackathon2

services:

  api:
    build:
      # The context stays the REPO ROOT - the image needs src/ and
      # pyproject.toml. Only the compose file moved.
      context: ..
      dockerfile: Dockerfile
    image: h2-api:0.1.0        # explicit version, never :latest
    container_name: h2-api
    restart: unless-stopped
    ports:
      # 8020 avoids hackathon1's 8010 and the course units' 8000.
      - "8020:8000"
    depends_on:
      app-db-init:
        condition: service_completed_successfully
    env_file: ../.env
    environment:
      # .env carries localhost values, which are correct for running uvicorn
      # outside Docker. These override them with in-network DNS names, so one
      # .env serves both deployment modes.
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      # NEO4J_URI is deliberately NOT overridden. No neo4j service exists on
      # this network any more (DECISIONS D48), so an in-network name here
      # would never resolve. .env's localhost value is left to stand: the
      # graph tool catches the connection failure and tells the agent to use
      # search_corpus instead.
      - MCP_MODE=http
      - MCP_URL=http://mcp-systems:8100/mcp
      # Pinned so .env can default to chroma for local CLI work. The container
      # has no Chroma index on disk - the index lives in the postgres service
      # beside it - so inheriting chroma here would start an API that
      # retrieves nothing and says so only in the audit trail.
      - VECTOR_BACKEND=pgvector
    networks:
      - h2-infra
    healthcheck:
      # python:3.12-slim ships no curl or wget. Reuse the python already on
      # PATH rather than adding a package purely for a healthcheck.
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz').read()\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  mcp-systems:
    # The MCP server runs as its own deployed service, not a subprocess, so the
    # process boundary between the agent and the systems it MUTATES is real.
    build:
      # The context stays the REPO ROOT - the image needs src/ and
      # pyproject.toml. Only the compose file moved.
      context: ..
      dockerfile: Dockerfile
    image: h2-api:0.1.0
    container_name: h2-mcp-systems
    restart: unless-stopped
    env_file: ../.env
    environment:
      - MCP_TRANSPORT=streamable-http
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
    command: ["python", "-m", "mcp_servers", "--server", "systems"]
    networks:
      - h2-infra
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8100/mcp').read()\" || exit 0"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  chainlit:
    # THE USER FACING VIEW, deployed rather than left as a command to type.
    # A front end nobody can reach without reading a README is a front end
    # nobody uses, and this is the surface a reviewer actually works in: ask a
    # question, read the assessment, answer the approval gate.
    #
    # Same image as the api, different command. Chainlit is already a
    # dependency, so this costs a container and no extra build.
    build:
      context: ..
      dockerfile: Dockerfile
    image: h2-api:0.1.0
    container_name: h2-chainlit
    restart: unless-stopped
    ports:
      # 8030 leaves 8020 to the API, and stays clear of hackathon1's 8010 and
      # the course units' 8000.
      - "8030:8000"
    depends_on:
      app-db-init:
        condition: service_completed_successfully
    env_file: ../.env
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - MCP_MODE=http
      - MCP_URL=http://mcp-systems:8100/mcp
      - VECTOR_BACKEND=pgvector
      # Chainlit writes a session cache next to the app. The image runs as uid
      # 10001, whose home is writable; without this it falls back to the
      # working directory and fails there.
      - HOME=/home/appuser
    command:
      ["chainlit", "run", "src/agentcore/api/chainlit_app.py",
       "--host", "0.0.0.0", "--port", "8000", "--headless"]
    networks:
      - h2-infra
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/').read()\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s

  app-db-init:
    # One-shot: wait for Postgres, then ensure the pgvector extension exists.
    # `condition: service_completed_successfully` is the only legal depends_on
    # here, because it is WITHIN this compose file.
    image: pgvector/pgvector:pg17
    container_name: h2-db-init
    restart: "no"
    networks:
      - h2-infra
    environment:
      PGPASSWORD: "h2passQWqw12"
    entrypoint: ["sh", "-c"]
    command:
      - |
        until pg_isready -h postgres -U h2; do
          echo "waiting for postgres..."
          sleep 2
        done
        psql -h postgres -U h2 -d hackathon2 -c "CREATE EXTENSION IF NOT EXISTS vector"
        echo "pgvector extension ready."

networks:
  h2-infra:
    external: true
